name: Prepare BEQUEM static Pages branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish static preview to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bequem-public
          cat package/part-*.b64 | base64 --decode > /tmp/bequem-preview.zip
          unzip -q /tmp/bequem-preview.zip -d /tmp/bequem-public
          test -s /tmp/bequem-public/index.html
          test -d /tmp/bequem-public/assets
          touch /tmp/bequem-public/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git switch gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/bequem-public/. .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish BEQUEM V12 static client preview"
            git push origin gh-pages
          fi
