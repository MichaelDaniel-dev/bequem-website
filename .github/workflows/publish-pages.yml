name: Publish BEQUEM Client Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview files
        uses: actions/checkout@v4
      - name: Reassemble and validate website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat package/part-*.b64 | base64 --decode > /tmp/bequem-website.zip
          unzip -q /tmp/bequem-website.zip -d _site
          test -s _site/index.html
          test -d _site/assets
          touch _site/.nojekyll
          echo "Files: $(find _site -type f | wc -l)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
